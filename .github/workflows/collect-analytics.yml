name: Collect Cloudflare Analytics

on:
  schedule:
    - cron: '0 15 * * *'  # 매일 00:00 KST (= 15:00 UTC)
  workflow_dispatch:
    inputs:
      date:
        description: '수집할 날짜 (YYYY-MM-DD, 비워두면 어제)'
        required: false
        default: ''
      send_email:
        description: '이메일 리포트 발송'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Collect analytics
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TARGET_DATE: ${{ inputs.date }}
          SEND_EMAIL: ${{ inputs.send_email || 'true' }}
        run: python analytics/collect.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/data/
          git diff --staged --quiet || git commit -m "analytics: add daily data"
          git push
